<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clarksville Weather Widget</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="weather-widget">
  <div class="main">
    <div class="weather-icon" aria-hidden="true">
      <div class="sun">✦</div>
    </div>

    <div class="temperature">
      <span id="temp">--</span><span class="degree">°</span>
    </div>

    <div class="divider"></div>

    <div class="details">
      <div class="feels">Feels Like <strong id="feels">--°</strong></div>
      <div class="condition" id="condition">Loading...</div>
    </div>
  </div>

  <div class="footer">
    <a href="https://www.weather.gov/lzk/" target="_blank" rel="noopener">National Weather Service</a>
    <span class="dot">•</span>
    <span>Updated <span id="updated">--</span></span>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
