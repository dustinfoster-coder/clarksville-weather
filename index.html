<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clarksville Weather</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="weather-card">
    <div class="weather-main">
        <img id="weatherIcon" class="weather-icon" src="" alt="Weather">

        <div class="temp-section">
            <div id="temperature" class="temperature">--°</div>
        </div>

        <div class="divider"></div>

        <div class="details">
            <div id="feelsLike" class="feels-like">
                Feels Like <span>--°</span>
            </div>
            <div id="forecast" class="forecast">Loading...</div>
        </div>
    </div>

    <div class="weather-footer">
        National Weather Service
        <span class="dot">•</span>
        Updated <span id="updateTime">--:--</span>
    </div>
</div>

<script src="app.js?v=3"></script>

</body>
</html>
